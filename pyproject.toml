[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "polars-kir-regions"
version = "0.1.0"
description = "Polars expressions slicing KIR ectodomain regions and HLA-contacting loops, given the gene"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Thorpe", email = "drchristhorpe@googlemail.com" }]
keywords = [
    "polars",
    "bioinformatics",
    "kir",
    "nk-cell",
    "immunology",
    "ectodomain",
    "annotation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = ["polars>=1.0"]

[project.urls]
Homepage = "https://github.com/drchristhorpe/polars_kir_regions"
Repository = "https://github.com/drchristhorpe/polars_kir_regions"

[tool.maturin]
python-source = "python"
module-name = "polars_kir_regions._internal"
features = ["pyo3/extension-module"]
include = [
    { path = "python/polars_kir_regions/regions/**/*", format = ["sdist", "wheel"] },
    { path = "python/polars_kir_regions/loops/**/*", format = ["sdist", "wheel"] },
]
strip = true

[dependency-groups]
dev = [
    # `histo_kir` supplies the region table and loop windows the vendoring scripts read, and the
    # parity tests compare against its numbering. It is a DEV dependency only: the built wheel
    # carries the vendored JSON and imports nothing from it at runtime. Its numba requirement
    # forces >=3.12 while this package's abi3 floor is 3.10, so those tests skip when it is absent.
    "histo-kir; python_version >= '3.12'",
    "numpy>=2.0; python_version >= '3.12'",
    "pytest>=8",
    "maturin>=1.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes tens of seconds because it walks the full IPD-KIR allele set",
]
